name: Build macOS

on:
  push:
    branches: [develop, ci/macos]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  QT_VERSION: "6.5.3"

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache vcpkg dependencies
      uses: actions/cache@v3
      with:
        path: |
          ../vcpkg
          ~/.cache/vcpkg
        key: vcpkg-macos-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}-v2
        restore-keys: |
          vcpkg-macos-v2

    - name: Cache Qt installation
      uses: actions/cache@v3
      with:
        path: Qt
        key: qt-${{ env.QT_VERSION }}-macos-clang64-v1
        restore-keys: |
          qt-${{ env.QT_VERSION }}-macos

    - name: Cache CMake installation
      uses: actions/cache@v3
      with:
        path: |
          /usr/local/bin/cmake
          /usr/local/bin/ctest
          /usr/local/bin/cpack
          /usr/local/share/cmake*
        key: cmake-3.28.3-macos-v1
        restore-keys: |
          cmake-3.28.3-macos

    - name: Cache Homebrew packages
      uses: actions/cache@v3
      with:
        path: |
          /usr/local/Cellar
          /usr/local/Homebrew
          /opt/homebrew/Cellar
          /opt/homebrew/var/homebrew
        key: homebrew-macos-${{ runner.os }}-autotools-v1
        restore-keys: |
          homebrew-macos-${{ runner.os }}

    - name: Install specific CMake version
      run: |
        # Check if CMake 3.28.3 is already cached
        if command -v cmake &> /dev/null && cmake --version | grep -q "3.28.3"; then
          echo "CMake 3.28.3 already installed (cached)"
        else
          echo "Installing CMake 3.28.3..."
          # Download and install CMake 3.28.3 (last version that supports old policies)
          curl -L -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-macos-universal.tar.gz
          tar -xzf cmake.tar.gz
          sudo cp -R cmake-3.28.3-macos-universal/CMake.app/Contents/bin/* /usr/local/bin/
          sudo cp -R cmake-3.28.3-macos-universal/CMake.app/Contents/share/cmake* /usr/local/share/
          rm -rf cmake.tar.gz cmake-3.28.3-macos-universal
        fi
        
        # Make sure our CMake is first in PATH
        echo "/usr/local/bin" >> $GITHUB_PATH
        
        # Verify CMake version
        cmake --version
        which cmake

    - name: Install Homebrew dependencies
      run: |
        # Check if essential tools are already installed
        MISSING_TOOLS=()
        for tool in pkg-config nasm autoconf automake libtool; do
          if ! command -v $tool &> /dev/null; then
            MISSING_TOOLS+=($tool)
          fi
        done
        
        if [ ${#MISSING_TOOLS[@]} -eq 0 ]; then
          echo "All Homebrew dependencies already installed (cached)"
        else
          echo "Installing missing Homebrew dependencies: ${MISSING_TOOLS[*]}"
          brew update
          # Install complete autotools chain for Python3 build
          brew install pkg-config nasm autoconf autoconf-archive automake libtool gettext
        fi
        
        # Make sure gettext is in PATH (sometimes needed for autoreconf)
        echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH

    - name: Install Qt6
      run: |
        # Install Qt using aqtinstall
        pip install aqtinstall
        
        # Debug aqt version and available architectures
        echo "=== AQT Debug Info ==="
        aqt version
        aqt list-qt mac desktop
        
        # Install Qt with explicit output directory
        aqt install-qt mac desktop ${{ env.QT_VERSION }} clang_64 \
            --outputdir ./Qt \
            -m qtmultimedia qtnetworkauth qtquick3d qtshadertools qtwebengine
        
        # Debug Qt installation
        echo "=== Qt Installation Debug ==="
        echo "Current directory: $(pwd)"
        echo "Qt directory contents:"
        ls -la Qt/ || echo "Qt directory not found"
        
        if [ -d "Qt/${{ env.QT_VERSION }}" ]; then
          echo "Qt version directory found:"
          ls -la Qt/${{ env.QT_VERSION }}/
        else
          echo "Qt version directory not found, searching for any Qt installation:"
          find Qt -name "Qt6Config.cmake" 2>/dev/null || echo "No Qt6Config.cmake found anywhere"
          find Qt -type d -name "*cmake*" 2>/dev/null || echo "No cmake directories found"
        fi
        
        # Add Qt to PATH
        echo "$(pwd)/Qt/${{ env.QT_VERSION }}/macos/bin" >> $GITHUB_PATH

    - name: Setup VCPKG
      run: |
        # Check if VCPKG is already cached
        if [ -d "../vcpkg" ] && [ -x "../vcpkg/vcpkg" ]; then
          echo "VCPKG already cached and ready"
        else
          echo "Cloning and bootstrapping VCPKG..."
          # Clone VCPKG in parent directory as expected by CMakePresets.json
          cd ..
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          cd xstudio
        fi

    - name: Create x265 CMake policy fix overlay
      run: |
        # Create overlay directory for x265 port
        mkdir -p vcpkg-overlays/x265
        
        # Copy the original x265 port files
        cp -r ../vcpkg/ports/x265/* vcpkg-overlays/x265/
        
        # Create a patch to fix CMake policies
        cat > vcpkg-overlays/x265/fix-cmake-policies.patch << 'EOF'
        --- a/source/cmake/version.cmake
        +++ b/source/cmake/version.cmake
        @@ -1,8 +1,12 @@
         # cmake policy
        -cmake_policy(SET CMP0025 OLD) # Clang just pretends to be GCC
        -cmake_policy(SET CMP0054 OLD) # Only interpret if() arguments as variables or keywords when unquoted.
        +if(POLICY CMP0025)
        +    cmake_policy(SET CMP0025 OLD) # Clang just pretends to be GCC
        +endif()
        +if(POLICY CMP0054)
        +    cmake_policy(SET CMP0054 OLD) # Only interpret if() arguments as variables or keywords when unquoted.
        +endif()
         
         find_package(Git QUIET) # if git is found, get build info from git
        EOF
        
        # Add the patch to the portfile
        sed -i '' '/vcpkg_apply_patches/a\
        \    PATCHES\
        \        ${CMAKE_CURRENT_LIST_DIR}/fix-cmake-policies.patch' vcpkg-overlays/x265/portfile.cmake
        
        echo "=== Created x265 overlay with CMake policy fix ==="
        ls -la vcpkg-overlays/x265/

    - name: Initialize OpenTimelineIO submodule
      run: |
        git submodule init
        git submodule update
        git apply cmake/otio_patch.diff

    - name: Update CMakePresets.json for CI
      run: |
        # Update Qt6_DIR path for CI environment
        QT_CMAKE_PATH="$(pwd)/Qt/${{ env.QT_VERSION }}/macos/lib/cmake/Qt6"
        echo "Qt CMAKE path: $QT_CMAKE_PATH"
        
        # Verify Qt installation exists
        if [ ! -d "$QT_CMAKE_PATH" ]; then
          echo "ERROR: Qt CMAKE path not found: $QT_CMAKE_PATH"
          echo "Available Qt directories:"
          find $(pwd)/Qt -name "Qt6Config.cmake" 2>/dev/null || echo "No Qt6Config.cmake found"
          ls -la $(pwd)/Qt/${{ env.QT_VERSION }}/macos/lib/cmake/ 2>/dev/null || echo "CMAKE dir not found"
          exit 1
        fi
        
        # Update the preset
        sed -i '' "s|/Users/tedwaine/Qt6/6.5.3/macos/lib/cmake/Qt6|$QT_CMAKE_PATH|g" CMakePresets.json
        
        # Verify the change
        echo "=== Updated CMakePresets.json ==="
        grep -A 5 -B 5 "Qt6" CMakePresets.json

    - name: Configure with CMake (ARM64)
      run: |
        # Debug environment
        echo "=== Environment Debug ==="
        echo "CMake version: $(cmake --version)"
        echo "CMake path: $(which cmake)"
        QT_CMAKE_PATH="$(pwd)/Qt/${{ env.QT_VERSION }}/macos/lib/cmake/Qt6"
        echo "Qt CMAKE path: $QT_CMAKE_PATH"
        echo "VCPKG path: $(pwd)/../vcpkg"
        echo "Autotools versions:"
        echo "  autoconf: $(autoconf --version | head -1)"
        echo "  automake: $(automake --version | head -1)"
        echo "  libtool: $(libtool --version | head -1)"
        echo "  autoreconf: $(autoreconf --version | head -1)"
        
        # Verify Qt installation
        echo "=== Qt Installation Check ==="
        if [ -f "$QT_CMAKE_PATH/Qt6Config.cmake" ]; then
          echo "✓ Qt6Config.cmake found at: $QT_CMAKE_PATH/Qt6Config.cmake"
        else
          echo "✗ Qt6Config.cmake NOT found at: $QT_CMAKE_PATH/Qt6Config.cmake"
          echo "Searching for Qt6Config.cmake:"
          find $(pwd)/Qt -name "Qt6Config.cmake" 2>/dev/null || echo "No Qt6Config.cmake found anywhere"
        fi
        
        # Set environment variables for vcpkg and CMake
        export VCPKG_ROOT="$(pwd)/../vcpkg"
        export CMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        export VCPKG_OVERLAY_PORTS="$(pwd)/vcpkg-overlays"
        export Qt6_DIR="$QT_CMAKE_PATH"
        export CMAKE_PREFIX_PATH="$QT_CMAKE_PATH:$(pwd)/Qt/${{ env.QT_VERSION }}/macos"
        
        # Use the MacOSRelease preset for ARM64 (GitHub runners are ARM64)
        cmake -B build --preset MacOSRelease \
          -DVCPKG_OVERLAY_PORTS="$(pwd)/vcpkg-overlays" \
          -DQt6_DIR="$QT_CMAKE_PATH" \
          -DCMAKE_PREFIX_PATH="$QT_CMAKE_PATH;$(pwd)/Qt/${{ env.QT_VERSION }}/macos"

    - name: Build xSTUDIO
      run: |
        cmake --build build --parallel $(sysctl -n hw.ncpu) --target install

    - name: Bundle dynamic libraries into app
      run: |
        cd build
        
        # Create Frameworks directory if it doesn't exist
        mkdir -p xSTUDIO.app/Contents/Frameworks
        
        # Find all required dynamic libraries
        echo "=== Bundling dynamic libraries ==="
        
        # First, let's find where the vcpkg libraries actually are
        echo "=== Searching for vcpkg libraries ==="
        find .. -name "libspdlog*.dylib" -type f 2>/dev/null || echo "No spdlog libraries found"
        find .. -name "*.dylib" -path "*/vcpkg*" -type f 2>/dev/null | head -10
        
        # Check multiple possible vcpkg library locations
        VCPKG_POSSIBLE_DIRS=(
          "../vcpkg_installed/arm-osx/lib"
          "../vcpkg_installed/arm64-osx/lib"
          "../vcpkg/installed/arm-osx/lib"
          "../vcpkg/installed/arm64-osx/lib"
          "vcpkg_installed/arm-osx/lib"
          "vcpkg_installed/arm64-osx/lib"
        )
        
        for dir in "${VCPKG_POSSIBLE_DIRS[@]}"; do
          if [ -d "$dir" ]; then
            echo "Found vcpkg lib directory: $dir"
            echo "Contents:"
            ls -la "$dir" | head -10
            
            echo "Copying libraries from: $dir"
            find "$dir" -name "*.dylib" -exec cp -v {} xSTUDIO.app/Contents/Frameworks/ \;
            break
          fi
        done
        
        # Also check for libraries that might be in the build directory itself
        echo "=== Checking build directory for libraries ==="
        find . -name "*.dylib" -type f 2>/dev/null | while read lib; do
          echo "Found library in build: $lib"
          cp -v "$lib" xSTUDIO.app/Contents/Frameworks/
        done
        
        # Copy Qt libraries that might be needed
        QT_LIB_DIR="../Qt/${{ env.QT_VERSION }}/macos/lib"
        if [ -d "$QT_LIB_DIR" ]; then
          echo "Copying essential Qt libraries from: $QT_LIB_DIR"
          # Only copy Qt libraries that are likely to be needed
          find "$QT_LIB_DIR" -name "libQt6*.dylib" -exec cp -v {} xSTUDIO.app/Contents/Frameworks/ \;
        fi
        
        # List what we copied
        echo "=== Bundled libraries ==="
        ls -la xSTUDIO.app/Contents/Frameworks/
        
        # Verify we have the required spdlog library
        if [ -f "xSTUDIO.app/Contents/Frameworks/libspdlog.1.15.3.dylib" ]; then
          echo "✓ libspdlog.1.15.3.dylib successfully bundled"
        else
          echo "✗ libspdlog.1.15.3.dylib NOT found in bundle"
          echo "Searching for any spdlog libraries:"
          find xSTUDIO.app/Contents/Frameworks/ -name "*spdlog*" || echo "No spdlog libraries in bundle"
        fi
        
        # Add rpath to the main executable
        MAIN_EXEC="xSTUDIO.app/Contents/MacOS/xstudio.bin"
        if [ -f "$MAIN_EXEC" ]; then
          echo "=== Adding rpath to main executable ==="
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$MAIN_EXEC" 2>/dev/null || echo "rpath may already exist"
          
          # Show current rpaths
          echo "Current rpaths:"
          otool -l "$MAIN_EXEC" | grep -A2 LC_RPATH || echo "No rpaths found"
        fi
        
        echo "=== Library bundling complete ==="

    - name: Cache vcpkg built packages
      uses: actions/cache@v3
      with:
        path: |
          ../vcpkg/installed
          ../vcpkg/packages
          build/vcpkg_installed
        key: vcpkg-built-macos-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('../vcpkg/.git/HEAD') }}-v1
        restore-keys: |
          vcpkg-built-macos-${{ hashFiles('vcpkg.json') }}-v1
          vcpkg-built-macos-v1

    - name: Create DMG installer
      run: |
        cd build
        
        # Verify library bundling before creating DMG
        echo "=== Pre-DMG verification ==="
        if [ -f "xSTUDIO.app/Contents/MacOS/xstudio.bin" ]; then
          echo "Main executable dependencies:"
          otool -L xSTUDIO.app/Contents/MacOS/xstudio.bin
          echo ""
          echo "Main executable rpaths:"
          otool -l xSTUDIO.app/Contents/MacOS/xstudio.bin | grep -A2 LC_RPATH || echo "No rpaths found"
        fi
        
        echo "Bundled frameworks:"
        ls -la xSTUDIO.app/Contents/Frameworks/ || echo "No Frameworks directory"
        
        # Check if xSTUDIO.app was created
        if [ -d "xSTUDIO.app" ]; then
          echo "Found xSTUDIO.app, creating DMG..."
          
          # Create a temporary directory for DMG contents
          mkdir -p dmg_temp
          cp -R xSTUDIO.app dmg_temp/
          
          # Create symbolic link to Applications
          ln -s /Applications dmg_temp/Applications
          
          # Create DMG
          hdiutil create -volname "xSTUDIO" \
                         -srcfolder dmg_temp \
                         -ov -format UDZO \
                         "xSTUDIO-macOS-${{ github.sha }}.dmg"
          
          echo "DMG created successfully"
          ls -la xSTUDIO-macOS-*.dmg
        else
          echo "xSTUDIO.app not found in build directory"
          echo "Build directory contents:"
          ls -la
          exit 1
        fi

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: xSTUDIO-macOS-installer
        path: build/xSTUDIO-macOS-*.dmg
        retention-days: 30

    - name: Upload App Bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: xSTUDIO-macOS-app
        path: build/xSTUDIO.app/
        retention-days: 30

    - name: Upload vcpkg dependencies artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vcpkg-dependencies-macos-${{ github.sha }}
        path: |
          ../vcpkg/installed
          build/vcpkg_installed
        retention-days: 7
        compression-level: 6

    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-macos
        path: |
          build/CMakeFiles/CMakeOutput.log
          build/CMakeFiles/CMakeError.log
          build/vcpkg-bootstrap.log
          ../vcpkg/buildtrees/x265/config-*.log
          ../vcpkg/buildtrees/x265/*.log
          ../vcpkg/buildtrees/python3/autoconf-*.log
          ../vcpkg/buildtrees/python3/*.log
          ../vcpkg/buildtrees/*/config-*.log
          vcpkg-overlays/
        retention-days: 7
